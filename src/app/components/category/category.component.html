<ul class="list-group">
  <li (click)="clearCurrentCategory()" [class]="getAllCategoryClass()" routerLink="/products">All</li>
  <li (click) = "setCurrentCategory(category)" 
  routerLink = "/products/category/{{category.categoryId}}"
  [class]="getCurrentCategoryClass(category)" 
  *ngFor="let category of categories">
    {{category.categoryName}}
  </li>
</ul>
